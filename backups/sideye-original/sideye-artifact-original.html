"Be careful" es genérico. "Read the room" señala que no está captando el ambiente.']}]),Vb=ze({id:"awkward",vol:7,title:"Awkward Situations",tagline:"Survive the cringe. Gracefully.",blurb:"Nombres olvidados, encuentros inesperados y silencios eternos.",unlock:3,colors:["#2a2230","#6e5a7e"]},[{en:"Well, [this is awkward].",es:"Bueno, esto es incómodo.",level:"B1",tags:["humorous"],context:"Cuando la incomodidad es evidente para todos.",meaning:"Reconocer en voz alta la incomodidad para romperla, a menudo con humor.",mistake:'Usar "uncomfortable" para situaciones sociales: "awkward" es la palabra.',ex:["You're both wearing the same dress. Well, this is awkward.","Lleváis el mismo vestido. Bueno, esto es incómodo."],gist:"Qué situación más incómoda",literal:"Bueno, esto es torpe",wrong:["Esto es peligroso","Esto me encanta"],intent:"joking",scene:"Entras en la sala de reuniones y el nuevo cliente es tu ex.",cue:["Oh. Hi. I didn't know you worked here.","Well, this is incommode.","This is a weird situation for me now."],chunkWrong:["this is awkwarding","this is akward"],calques:["Well, this is incommode.","Good, this is uncomfortable."],battle:["Te encuentras a tu jefe en una app de citas.","This is embarrassing.",'"Embarrassing" es vergüenza tuya. "Awkward" es la incomodidad compartida del momento.']},{en:"I'm so sorry, I'm [terrible with names].",es:"Perdona, soy fatal con los nombres.",level:"B1",tags:["polite"],context:"Cuando alguien te saluda y no recuerdas su nombre.",meaning:"Excusa socialmente aceptada para admitirlo sin ofender.",mistake:`Decir "I'm fatal with names" o "I'm bad for names".`,ex:["Sorry, remind me — I'm terrible with names.","Perdona, recuérdamelo, que soy fatal con los nombres."],gist:"No recuerdo tu nombre, perdona",literal:"Soy una persona terrible con nombre",wrong:["Tu nombre es muy feo","No me gusta tu nombre"],intent:"sincere",scene:"Alguien te saluda con entusiasmo en una fiesta. Os conocéis. Ni idea de su nombre.",cue:["Hey! So great to see you again!","Sorry, I am fatal with the names.","Sorry, I'm bad for names."],chunkWrong:["fatal with names","terrible for names"],calques:["I'm so sorry, I'm fatal with names.","Forgive me, I am horrible for the names."],battle:["No recuerdas el nombre de alguien que te saluda con cariño.","What's your name?","Preguntarlo directamente suena brusco si ya os conocéis. La disculpa suaviza el momento."]},{en:"Oops, wrong chat. [My bad]!",es:"Uy, chat equivocado. ¡Culpa mía!",level:"B1",tags:["informal"],context:"Disculpa rápida por un error pequeño.",meaning:"Reconoces el fallo sin dramatizar.",mistake:"Usarlo para errores graves: ahí suena a que no te importa.",ex:["I took your seat? My bad.","¿Me he sentado en tu sitio? Fallo mío."],gist:"Culpa mía (error pequeño)",literal:"Mi malo",wrong:["Me siento fatal, lo siento muchísimo","Soy mala persona"],intent:"sincere",scene:'Le das a "responder a todos" con un meme que era para un compañero.',cue:["Did you mean to send that to the whole team?","My fault, sorry for the inconvenients.","Guilty mine!"],chunkWrong:["My wrong","Mine bad"],calques:["Oops, wrong chat. Fault mine!","Oops, wrong chat. Guilt of mine!"],battle:["Te equivocas de cola en el súper y alguien te lo dice.","I apologize for my mistake.",'Demasiado formal para algo tan pequeño. "My bad" es la disculpa casual perfecta.']},{en:"Did I [catch you at a bad time]?",es:"¿Te pillo en mal momento?",level:"B1",tags:["polite"],context:"Al llamar o interrumpir a alguien.",meaning:"Pregunta educada para comprobar si puede hablar.",mistake:'Decir "Do I take you in a bad moment?".',ex:["Hey, did I catch you at a bad time? You sound busy.","Oye, ¿te pillo en mal momento? Pareces liado."],gist:"¿Te pillo en mal momento?",literal:"¿Te atrapé en un mal tiempo?",wrong:["¿Llego tarde?","¿Hace mal tiempo ahí?"],intent:"sincere",scene:"Llamas a tu amigo y se oye un bebé llorando y una sartén.",cue:["Hello? Sorry, it's chaos here.","Do I take you in a bad moment?","Am I catching you in bad moment?"],chunkWrong:["take you at a bad time","catch you in a bad moment"],calques:["Do I take you in a bad moment?","Do I catch you in bad moment?"],battle:["Llamas a alguien y notas que está liado.","Are you busy?",'"Are you busy?" es correcto pero seco. "Did I catch you at a bad time?" es más considerado.']},{en:"Sorry, I totally [zoned out].",es:"Perdona, me he quedado en las nubes.",level:"B2",tags:["informal","phrasal"],context:"Cuando desconectas mentalmente en mitad de una conversación.",meaning:"Te has ido un momento; no estabas escuchando.",mistake:"Pensar que saliste de una zona.",ex:["Sorry, I zoned out. What were you saying?","Perdona, me he ido. ¿Qué decías?"],gist:"Me he distraído, desconecté",literal:"Salí de la zona",wrong:["Me quedé dormido de verdad","Me fui del barrio"],intent:"sincere",scene:"Tu amiga lleva cinco minutos contándote algo y te pregunta qué opinas. No has oído nada.",cue:["So what do you think I should do?","Sorry, I stayed in the clouds.","Sorry, I was in the moon."],chunkWrong:["zoned off","zone out"],calques:["Sorry, I stayed in the clouds.","Sorry, I was in the moon."],battle:["Te distraes en una conversación y lo admites.","Sorry, I was sleeping.",'"I was sleeping" es literal y raro si estás despierto. "Zoned out" es esa desconexión breve.']}]),_b=ze({id:"idioms",vol:8,title:"Idioms & Phrasal Verbs",tagline:"Small words. Big meanings.",blurb:"Las expresiones que hacen que un nativo suene a nativo.",unlock:4,colors:["#262a1a","#7c7e4a"]},[{en:"I'm still [on the fence].",es:"Todavía no lo tengo claro.",level:"B2",tags:["idiom"],context:"Cuando dudas entre dos opciones.",meaning:"Estás indeciso: entiendes las opciones, pero no has elegido.",mistake:`Decir "I still don't have it clear".`,ex:["I'm still on the fence about moving to Berlin.","Aún no tengo claro lo de mudarme a Berlín."],gist:"Estoy indeciso",literal:"Sigo encima de la valla",wrong:["Estoy atrapado","Estoy enfadado"],intent:"sincere",scene:"Te preguntan si aceptarás la oferta de trabajo en otra ciudad.",cue:["So, are you taking the job or not?","I still don't have it clear.","I'm in the middle of the wall."],chunkWrong:["on the wall","in the fence"],calques:["I still don't have it clear.","I don't have it clear yet."],battle:["Dudas entre dos pisos y aún no has decidido.","I'm confused.",'"Confused" es no entender. "On the fence" es entender, pero no decidir.']},{en:"Let's [call it a day].",es:"Dejémoslo por hoy.",level:"B1",tags:["idiom"],context:"Para terminar de trabajar en algo por hoy.",meaning:"Parar y seguir otro día.",mistake:"Pensar que propone ponerle nombre a algo.",ex:["It's nine p.m. Let's call it a day.","Son las nueve de la noche. Dejémoslo por hoy."],gist:"Paramos por hoy",literal:"Llamémoslo un día",wrong:["Hagamos una llamada","Quedemos otro día para cenar"],intent:"sincere",scene:"Llevas diez horas montando un mueble con tu pareja y falta un tornillo.",cue:["We're never finishing this thing tonight.","Let's leave it for today.","Let's finish for the day of today."],chunkWrong:["name it a day","call it the day"],calques:["Let's leave it for today.","We leave it for today."],battle:["Quieres terminar la jornada con tu equipo de forma natural.","Let's stop working forever.",'"Forever" lo cambia todo: suena a dimisión. "Call it a day" es solo por hoy.']},{en:"You'll [figure it out].",es:"Ya darás con la solución.",level:"B1",tags:["phrasal"],context:"Para animar a alguien agobiado.",meaning:"Confías en que resolverá el problema por sí mismo.",mistake:'Relacionarlo con "figura" o "dibujar".',ex:["Don't panic. You'll figure it out.","No te agobies. Ya darás con ello."],gist:"Ya encontrarás la solución",literal:"Lo figurarás fuera",wrong:["Lo dibujarás","Lo perderás"],intent:"sincere",scene:"Tu hermano te cuenta agobiado que no sabe qué hacer con su vida.",cue:["I have no idea what I'm doing with my life.","You will find the solution, sure.","You'll figure out it."],chunkWrong:["figure out it","figure it up"],calques:["You'll find the solution.","You'll give with it."],battle:["Animas a alguien que está agobiado con un problema.","You'll solve it.",`Correcto pero plano. "You'll figure it out" es lo que diría un amigo.`]},{en:"Guess who I [bumped into] at the gym.",reply:"I just [bumped into] my ex. In pyjamas.",es:"Adivina con quién me crucé en el gimnasio.",level:"B1",tags:["phrasal"],context:"Encuentros por casualidad.",meaning:"Encontrarte con alguien sin planearlo.",mistake:"Pensar que chocaste físicamente.",ex:["I bumped into my ex buying bread in pyjamas.","Me crucé con mi ex comprando pan en pijama."],gist:"Me encontré a alguien por casualidad",literal:"Me choqué contra alguien",wrong:["Quedé con alguien","Le pegué a alguien"],intent:"sincere",scene:"Saliste a por pan en pijama y apareció justo quien no querías ver.",cue:["Why do you look like you've seen a ghost?","I crashed with my ex.","I found myself with my ex."],chunkWrong:["bumped with","bumped onto"],calques:["Guess who I found myself with at the gym.","Guess with who I crossed at the gym."],battle:["Te encuentras por casualidad a un excompañero en el aeropuerto.","I met an ex-colleague.",'"Met" puede sonar a que quedasteis. "Bumped into" deja claro que fue casualidad.']},{en:"Just boil the pasta. It's [not rocket science].",reply:"The big one. It's [not rocket science].",es:"Solo cuece la pasta. Tampoco es tan difícil.",level:"B2",tags:["idiom","humorous"],context:"Cuando algo es fácil y alguien lo complica.",meaning:"Es sencillo. Con un toque de guasa (o de condescendencia).",mistake:"Usarlo con alguien agobiado de verdad: puede sonar condescendiente.",ex:["Assembling a shelf isn't rocket science.","Montar una estantería tampoco es física cuántica."],gist:"No es tan complicado",literal:"No es ciencia de cohetes",wrong:["Es muy complicado","No es nada científico"],intent:"annoyed",scene:"Tu compañero de piso pregunta por tercera vez cómo funciona la lavadora.",cue:["Wait, which button do I press again?","It's not science of rockets.","It's not difficult thing."],chunkWrong:["not science rocket","not a rocket science"],calques:["Just cook the pasta. It's not for so much.","Just cook the pasta. It's not quantum physics."],battle:["Alguien se complica la vida con algo facilísimo y le quitas hierro con guasa.","It's very simple.",`Correcto pero sin chispa. "It's not rocket science" añade la ironía.`]}]),Fb=ze({id:"passive",vol:9,title:"Passive-Aggressive English",tagline:"Polite on the surface. Furious underneath.",blurb:"Educación con veneno. Aprende a detectarla (y a usarla con moderación).",unlock:4,colors:["#2f1a1a","#7a3b33"]},[{en:"[Just a friendly reminder] to wash your own mugs.",es:"Solo un recordatorio amistoso: cada uno friega su taza.",level:"B2",tags:["passive-aggressive","work"],context:"Notas en la oficina, correos, grupos de vecinos.",meaning:'Rara vez es amistoso: significa "te lo hemos dicho mil veces".',mistake:"Leerlo como algo cálido.",ex:["Just a friendly reminder that the meeting started ten minutes ago.","Solo un recordatorio amistoso: la reunión empezó hace diez minutos."],gist:"Te lo digo otra vez, y ya cansa",literal:"Solo un recordatorio de amigos",wrong:["Te invito a algo","Te echo de menos"],intent:"passive-aggressive",scene:"Una nota en la nevera de la oficina. La quinta esta semana.",cue:["Nobody has cleaned the kitchen again. How do I say it nicely?","Write: friendly remembering...","Put: a reminder of friendship..."],chunkWrong:["Only a friendly remember","Just a friend reminder"],calques:["Only a friendly remembering: everyone washes his cup.","Just a remember of friend: each one washes his mug."],battle:['Quieres recordar algo a un compañero, con educación pero con un toque de "otra vez".',"Remember!",'"Remember!" a secas suena a orden. "Just a friendly reminder" es la versión educada... con veneno.']},{en:"You're off on Fridays? [Must be nice].",reply:"Three months? [Must be nice].",es:"¿Libras los viernes? Qué bien viven  que no llegas a tiempo"],intent:"passive-aggressive",scene:"Tu jefe te escribe un viernes a las 18:55.",cue:["When do you need the slides?","Without hurry, but today is better.","There is no hurry but I need them now, urgent."],chunkWrong:["No hurries","Not rush"],calques:["Without hurry, but today would be great.","No hurry, but today it would be ideal, eh."],battle:["Necesitas algo pronto pero quieres sonar relajado.","I need it now.",'"I need it now" es honesto pero presiona. "No rush, but..." suaviza (y todos saben lo que significa).']}]),Ob=ze({id:"slang",vol:10,title:"American Slang",tagline:"No cap, this one is useful.",blurb:"El inglés de redes, series y gente de menos de 35. Úsalo con quien lo usa.",unlock:5,colors:["#1d2033","#4b5482"]},[{en:"That's [lowkey] the best pizza in town.",es:"Esa es, sin exagerar, la mejor pizza de la ciudad.",level:"B2",tags:["slang"],context:"Para admitir algo con discreción.",meaning:'"Lowkey" = discretamente, un poco en secreto. Matiza una opinión sincera.',mistake:'Pensar que significa "de baja calidad".',ex:["I lowkey love this terrible show.","En el fondo me encanta esta serie malísima."],gist:"La verdad (dicho bajito) es la mejor",literal:"Esa es la llave baja",wrong:["Es una pizza barata y mala","Es la pizza más cara"],intent:"sincere",scene:"Tu amigo prueba una pizzería de barrio sin pretensiones y se queda callado.",cue:["This place looks kind of sad, no?","It's low key the best pizza of the city.","Honestly it's low-quality but good."],chunkWrong:["lowkeys","low-level"],calques:["That's, without exaggerating, the best pizza of the city.","That is honestly the best pizza of town."],battle:["Admites con un poco de vergüenza que te gusta una serie malísima.","I really love this show.",'Suena sincero sin matiz. "I lowkey love this show" admite la debilidad con discreción.']},{en:"A violinist on a second date? He's [so extra].",reply:"Velvet? At a barbecue? He's [so extra].",es:"¿Un violinista en la segunda cita? Es un intenso.",level:"B2",tags:["slang","humorous"],context:"Alguien que exagera, dramatiza o se pasa.",meaning:"Demasiado: en el look, los planes o las reacciones.",mistake:'Pensar en "extra" de cine o en "de sobra".',ex:["A twelve-page birthday invite? So extra.","¿Una invitación de cumpleaños de doce páginas? Qué exagerado."],gist:"Es demasiado, se pasa",literal:"Es muy adicional",wrong:["Es actor secundario","Es buenísimo"],intent:"joking",scene:"Tu amigo llega a una barbacoa con chaqueta de terciopelo y un discurso preparado.",cue:["Marco showed up to the barbecue in velvet. With a speech.","He's very exaggerated.","He is too much intense."],chunkWrong:["so extras","such extra"],calques:["A violinist on the second date? He's an intense.","A violinist on a second date? He's very exaggerated."],battle:["Describes con humor a alguien que siempre lo hace todo a lo grande.","He's dramatic.",'"Dramatic" apunta a drama emocional. "Extra" es pasarse en general.']},{en:"[No cap], it was the best night ever.",es:"Sin mentir, fue la mejor noche de mi vida.",level:"B2",tags:["slang"],context:"Para enfatizar que no exageras. Muy de gente joven.",meaning:'"Cap" = mentira. "No cap" = en serio, sin exagerar.',mistake:"Pensar que habla de gorras.",ex:["No cap, this coffee changed my life.","Sin exagerar, este café me ha cambiado la vida."],gist:"En serio, sin mentir",literal:"Sin gorra",wrong:["No llevaba gorra","No tenía límite de dinero"],intent:"sincere",scene:"Tu primo de 19 años te cuenta su primer festival.",cue:["Was the festival actually that good?","No hat, it was the best.","Without lies, best night of history."],chunkWrong:["No hat","No caps"],calques:["Without lying, it was the best night of my life.","Without lie, it was the best night of my life."],battle:["Hablas con amigos jóvenes y quieres enfatizar que no exageras.","Honestly, ...",'"Honestly" vale en cualquier registro. "No cap" es slang joven: úsalo solo con quien lo usa.']},{en:"Double shift today. [I'm beat].",reply:"Can't. Boxes all day. [I'm beat].",es:"Doble turno hoy. Estoy reventado.",level:"B1",tags:["slang","informal"],context:"Agotamiento tras un día largo.",meaning:'Agotadísimo. Más fuerte y más coloquial que "tired".',mistake:"Pensar que te han pegado o derrotado.",ex:["I'd love to, but I'm beat. Rain check?","Me encantaría, pero estoy muerto. ¿Lo dejamos para otro día?"],gist:"Estoy agotado",literal:"Estoy golpeado",wrong:["Me han pegado","He perdido el partido"],intent:"sincere",scene:"Llegas a casa a las once tras ayudar a un amigo con su mudanza.",cue:["Wanna go out for a drink?","I'm exploded.","I'm destroyed, I'm beaten."],chunkWrong:["I'm beaten","I'm beating"],calques:["Double shift today. I'm exploded.","Double turn today. I'm broken."],battle:["Estás muy cansado tras un día larguísimo, en tono coloquial.","I'm tired.",`Correcto pero suave. "I'm beat" es agotamiento total.`]},{en:"A 'free iPhone' link? That's [sketchy].",reply:"Cash before you see it? That's [sketchy].",es:'¿Un enlace de "iPhone gratis"? Huele raro.',level:"B2",tags:["slang"],context:"Algo dudoso, poco fiable o turbio.",meaning:"Sospechoso. No te fías.",mistake:'Pensar en "sketch" (boceto).',ex:["The landlord only takes cash before you see the flat? Sketchy.","¿El casero solo acepta efectivo antes de ver el piso? Muy turbio."],gist:"Es sospechoso, no me fío",literal:"Eso es un boceto",wrong:["Es precioso","Está sin terminar"],intent:"sincere",scene:"Un piso céntrico enorme por 300 euros, y el casero solo acepta efectivo por adelantado.",cue:["The landlord says I have to pay cash before I see it.","That smells rare.","That's suspicious of fraud."],chunkWrong:["sketched","sketching"],calques:["A free iPhone link? That smells strange.","A free iPhone link? That smells rare."],battle:["Un trato parece demasiado bueno para ser verdad.","That's dangerous.",'"Dangerous" es peligro claro. "Sketchy" es sospechoso, raro, poco fiable.']}]),Bb=ze({id:"everyday",vol:1,title:"Everyday Conversations",tagline:"The small talk nobody taught you.",blurb:"Lo que se dice de verdad en el día a día, y que no venía en el libro de texto.",unlock:1,colors:["#2b2a26","#6b6450"]},[{en:"Sorry, I'm [running late]. Be there in ten.",es:"Perdona, voy con retraso. Llego en diez minutos.",level:"B1",tags:["informal"],context:"Mensaje a alguien que ya te está esperando.",meaning:`Avisas de que vas tarde antes de llegar. Es la fórmula natural; "I'm late" se usa más cuando ya has llegado tarde.`,mistake:`Decir "I'm coming late" o "I go with delay".`,ex:["Running late — save me a seat?","Voy tarde, ¿me guardas un sitio?"],gist:"Voy con retraso, llego enseguida",literal:"Estoy corriendo tarde",wrong:["Estoy haciendo deporte, llegaré luego","Ya he llegado pero no te encuentro"],intent:"sincere",scene:"Tu amiga te escribe cinco minutos después de la hora a la que habíais quedado.",cue:["Hey, where are you? I'm already here.","I'm coming with delay, sorry for the inconvenients.","I go late. I arrive in ten minutes."],chunkWrong:["going late","running later"],calques:["Sorry, I go with delay. I arrive in ten minutes.","Sorry, I'm arriving late. I'm there in ten minutes of time."],battle:["Todavía no has llegado y quieres avisar de que vas tarde.","I'm late.",`"I'm late" suele decirse cuando la hora ya ha pasado o ya has llegado. "Running late" avisa por el camino.`]},{en:"[I'm good], thanks.",es:"No, gracias, estoy bien así.",level:"B1",tags:["informal","polite"],context:"Respuesta cuando te ofrecen algo: otra copa, más comida, ayuda.",meaning:`Ojo: ante una oferta, "I'm good" significa NO. Es un rechazo educado, no un informe de cómo estás.`,mistake:`Creer que estás aceptando. Si quieres otra, di "Sure" o "I'd love one".`,ex:[`"More wine?" "I'm good, thanks — driving tonight."`,"—¿Más vino? —No, gracias, que hoy conduzco."],gist:"No, gracias (rechazo educado)",literal:"Soy bueno, gracias",wrong:["Sí, ponme otra","Me encuentro de maravilla emocionalmente"],intent:"sincere",scene:"El camarero pregunta si quieres otra copa. Ya has tenido suficiente.",cue:["Can I get you another one?","I am well, thank you very much.","No, I don't want more of that."],chunkWrong:["I'm well","I'm right"],calques:["No, thanks, I'm well like this.","No, thank you, I'm fine like this."],battle:["Te ofrecen más tarta y no quieres, con naturalidad.","I don't want.",`"I don't want" sin objeto suena seco y raro. "I'm good, thanks" es el "no" educado por defecto.`]},{en:"So, what have you been [up to]?",es:"Bueno, ¿y qué es de tu vida?",level:"B1",tags:["informal","phrasal"],context:"Para ponerse al día con alguien a quien no ves desde hace tiempo.",meaning:"Pregunta casual para ponerse al día. No espera un informe detallado: con dos o tres titulares basta.",mistake:`Confundirlo con "What's up?" (un simple saludo) o responder con una lista de tareas.`,ex:["What have you been up to since the wedding?","¿Qué ha sido de ti desde la boda?"],gist:"¿Qué has hecho últimamente? Ponme al día",literal:"¿Hasta dónde has estado arriba?",wrong:["¿Dónde te habías escondido?","¿Por qué has subido?"],intent:"sincere",scene:"Te encuentras en el súper a un excompañero de clase al que no ves desde hace años.",cue:["Oh my God, hi! It's been forever!","What is of your life all this time?","Yes, much time! What do you do in your days now?"],chunkWrong:["up for","on to"],calques:["Well, what is of your life?","So, what have you been making?"],battle:["Quieres ponerte al día con alguien que no ves desde hace meses.","What's up?",`"What's up?" es un saludo rápido; la respuesta típica es "Not much". "What have you been up to?" invita a contar.`]},{en:"Anyway, I'll [let you go].",es:"Bueno, te dejo.",level:"B1",tags:["polite"],context:"Para terminar una llamada o una charla sin sonar brusco.",meaning:'Cierras la conversación presentándolo como un favor al otro: "no te robo más tiempo".',mistake:'Entenderlo como "te libero" o "te despido".',ex:["Anyway, I'll let you go — say hi to your mum.","Bueno, te dejo, dale recuerdos a tu madre."],gist:"Bueno, te dejo (fin de la conversación)",literal:"Te dejaré ir",wrong:["Puedes irte de la empresa","Te perdono, no pasa nada"],intent:"sincere",scene:"Llevas veinte minutos al teléfono con tu tía y quieres colgar sin parecer borde.",cue:["...so yeah, that's basically my whole week.","Okay, I have to cut now. Bye.","Well, I leave you now."],chunkWrong:["leave you go","let you going"],calques:["Well, I leave you.","Good, I leave you now."],battle:["Quieres terminar una llamada con amabilidad.","I have to go.",`"I have to go" pone la excusa en ti. "I'll let you go" finge que le haces un favor al otro: más suave.`]},{en:"Tacos tonight? [I'm down].",reply:"[I'm down]. I'll bring the wine.",es:"¿Tacos esta noche? Me apunto.",level:"B1",tags:["informal","slang"],context:"Aceptar un plan entre amigos.",meaning:"Aceptas con entusiasmo casual. Nada que ver con estar triste.",mistake:`Confundirlo con "I'm feeling down" (estoy de bajón).`,ex:["Road trip in May? I'm so down.","¿Escapada en coche en mayo? Me apunto ya."],gist:"Me apunto",literal:"Estoy abajo",wrong:["Estoy de bajón","Estoy en la planta de abajo"],intent:"sincere",scene:"Tu compañera de piso propone pedir comida mexicana y ver una peli.",cue:["Pizza and a terrible movie tonight?","I point myself!","I am in agreement with this plan."],chunkWrong:["I'm up","I'm low"],calques:["Tacos tonight? I point myself.","Tacos tonight? I sign myself up."],battle:["Te proponen un plan y quieres decir que te apuntas.","I'm feeling down.",`"I'm feeling down" = estoy de bajón. "I'm down" a secas = me apunto.`]}]),Wb=ze({id:"sarcasm",vol:2,title:"Sarcasm & Wit",tagline:'When "great" means terrible.',blurb:"El idioma no oficial del inglés. Si no pillas el tono, no pillas la mitad.",unlock:1,colors:["#3a1219","#8e2c3a"]},[{en:"Oh, [that's just perfect].",es:"Genial, lo que me faltaba.",level:"B1",tags:["sarcastic"],context:"Cuando algo sale mal en el peor momento posible.",meaning:'Significa lo contrario: es un desastre. El "just" y el tono plano delatan la ironía.',mistake:'Tomarlo como celebración y responder "Glad you like it!".',ex:["The printer jammed five minutes before the deadline. Oh, that's just perfect.","La impresora se ha atascado cinco minutos antes de la entrega. Genial, lo que me faltaba."],gist:"Genial, lo que me faltaba (es un desastre)",literal:"Oh, eso es simplemente perfecto",wrong:["Todo ha salido como quería","Estoy impresionado con el resultado"],intent:"sarcastic",scene:"Empieza a diluviar justo cuando sales de la peluquería.",cue:["The trains are cancelled. We'll have to walk.","Oh, how perfect! I love walking so much!","That is a perfect situation for us."],chunkWrong:["that's just perfectly","that's only perfect"],calques:["Great, what I was missing.","Great, the only thing missing for me."],battle:["Se te cae el móvil al váter y quieres expresar fastidio con ironía.","That's absolutely perfect!",`"Absolutely perfect!" con entusiasmo suena sincero. "That's just perfect" dicho plano es la ironía clásica.`]},{en:"[Way to go], genius.",es:"Muy bien, campeón.",level:"B2",tags:["sarcastic","informal"],context:"Cuando alguien la lía de forma evidente.",meaning:'"Way to go" es "bien hecho", pero con "genius" y ante un desastre, es pura burla.',mistake:'Tomarlo como un elogio porque a veces "way to go" es sincero.',ex:["You locked the keys inside the car? Way to go, genius.","¿Te has dejado las llaves dentro del coche? Muy bien, campeón."],gist:"Menuda la has liado (burla)",literal:"Ese es el camino, genio",wrong:["Eres realmente brillante","Vas por buen camino"],intent:"sarcastic",scene:"Tu amigo manda al grupo de la familia un mensaje que era para su ex.",cue:["I just sent the screenshot to the person in the screenshot.","Congratulations for your intelligence.","Good road, genius."],chunkWrong:["Way to going","Road to go"],calques:["Very good, champion.","Very well, champion."],battle:["Tu hermano rompe el jarrón que acababa de pegar y te burlas.","Good job!",'"Good job!" a secas se entiende como elogio real. "Way to go, genius" deja clara la burla.']},{en:"[Tell me about it].",es:"Dímelo a mí.",level:"B1",tags:["informal"],context:"Cuando alguien se queja de algo que tú también sufres.",meaning:"No pides detalles: estás totalmente de acuerdo porque te pasa lo mismo.",mistake:"Pensar que te piden que cuentes la historia y quedarte esperando.",ex:['"Mondays are brutal." "Tell me about it."',"—Los lunes son durísimos. —Dímelo a mí."],gist:"Totalmente, a mí me pasa igual",literal:"Cuéntamelo",wrong:["Explícame qué ha pasado","No me interesa"],intent:"sincere",scene:"Tu compañera suspira: el aire acondicionado de la oficina vuelve a estar a 16 grados.",cue:["This commute is going to kill me.","Tell me what happened.","Say it to me."],chunkWrong:["Say me about it","Tell me of it"],calques:["Say it to me.","Tell it to me."],battle:["Alguien se queja de su casero; el tuyo es igual de horrible.","Tell me more.",'"Tell me more" pide detalles de verdad. "Tell me about it" significa "ni me lo digas, me pasa igual".']},{en:"[Could you be any more obvious]?",es:"¿Se te podría notar más?",level:"B2",tags:["sarcastic","humorous"],context:"Cuando alguien intenta disimular algo y se le ve a la legua.",meaning:"Pregunta retórica: se le nota muchísimo. Burla ligera, típica entre amigos.",mistake:"Responder con una explicación, como si fuera una pregunta real.",ex:["You're staring at her like she's a dessert menu. Could you be any more obvious?","La miras como si fuera la carta de postres. ¿Se te podría notar más?"],gist:"Se te nota muchísimo",literal:"¿Podrías ser una persona más clara?",wrong:["¿Puedes explicarlo mejor?","No se te nota nada, tranquilo"],intent:"joking",scene:"Tu amiga jura que no le gusta nadie del curro mientras sonríe cada vez que él le escribe.",cue:["I'm totally not into him. Oh wait — he just texted!","You can be more obvious if you want.","Is it possible to be more obvious? I ask."],chunkWrong:["Could you be any most obvious","Can you be more obviously"],calques:["Could it be noticed more?","Can it be noticed more on you?"],battle:["Tu amigo finge no esperar un mensaje y es evidentísimo.","Are you being obvious?",'"Are you being obvious?" es una pregunta rara y neutra. La versión retórica es la burla natural.']},{en:"Thanks for the [heads-up]... an hour later.",es:"Gracias por avisar... una hora tarde.",level:"B2",tags:["sarcastic"],context:"Cuando alguien te avisa de algo cuando ya no sirve de nada.",meaning:'"Heads-up" es un aviso. Aquí agradeces con ironía porque el aviso llegó tarde.',mistake:'Traducir "heads-up" como "cabeza arriba" o "ánimo".',ex:[`"FYI, the meeting moved to nine." "Thanks for the heads-up. It's ten."`,"—Por cierto, la reunión se movió a las nueve. —Gracias por avisar. Son las diez."],gist:"Gracias por avisar (tarde, ya no sirve)",literal:"Gracias por la cabeza arriba",wrong:["Gracias por animarme","Gracias por el regalo"],intent:"sarcastic",scene:"Llegas a la fiesta en vaqueros; ahora tu amiga te dice que era de etiqueta.",cue:["Oh, by the way, it was black tie.","Thank you for warning me in this moment.","Thanks for the head up."],chunkWrong:["head-up","heads-on"],calques:["Thanks for warning... one hour late.","Thanks for the notice... an hour more late."],battle:["Te avisan tarde y quieres quejarte con ironía.","Thanks for warning me.",'"Thanks for warning me" suena sincero y algo formal. "Thanks for the heads-up... an hour later" es ironía de manual.']}]),$b=ze({id:"dating",vol:3,title:"Dating Disasters",tagline:"Swipe left on literal translations.",blurb:"Apps, primeras citas y finales con poca elegancia. Para entender qué te están diciendo de verdad.",unlock:1,colors:["#3b1d2a","#9a4a5e"]},[{en:"We're just [talking].",es:"Solo nos estamos conociendo.",level:"B2",tags:["informal"],context:"La fase previa a salir oficialmente: mensajes, alguna cita, nada definido.",meaning:"No es que solo charléis: es una relación en pruebas, sin etiqueta.",mistake:'Entenderlo literal: "solo hablamos, no hay nada".',ex:[`"Is he your boyfriend?" "No, no, we're just talking."`,"—¿Es tu novio? —No, no, nos estamos conociendo."],gist:"Nos estamos conociendo, sin etiqueta",literal:"Solo estamos conversando",wrong:["Somos amigos y nada más","Hemos discutido y ya no nos vemos"],intent:"evasive",scene:"Tu prima lleva tres semanas quedando con alguien pero esquiva todas tus preguntas.",cue:["So are you two, like, a thing now?","We are only speaking.","We just talk, nothing more, nothing."],chunkWrong:["speaking","chatting with"],calques:["We're just knowing each other.","We're only knowing us."],battle:["Llevas un mes quedando con alguien, pero no sois pareja oficial.","We're dating.",`"We're dating" implica algo más establecido. "We're just talking" es la fase anterior.`]},{en:"He [ghosted] me.",reply:"Nope. She [ghosted] me.",es:"Desapareció sin decir nada.",level:"B1",tags:["slang"],context:"Alguien corta todo contacto de golpe, sin explicaciones.",meaning:'Desaparecer como un fantasma: ni un mensaje más. En España también decimos "me hizo ghosting".',mistake:"Pensar que te asustó o que vio un fantasma.",ex:["Three great dates, then nothing. Totally ghosted me.","Tres citas geniales y luego nada. Me hizo ghosting total."],gist:"Desapareció sin dar explicaciones",literal:"Se convirtió en fantasma delante de mí",wrong:["Me dio un susto de muerte","Me dejó con una carta muy larga"],intent:"annoyed",scene:"Tu amigo lleva una semana mirando el móvil: ella dejó de contestar sin más.",cue:["Did she ever text you back?","No, she made a ghost of me.","She disappeared me."],chunkWrong:["ghosting","haunted"],calques:["He made me ghosting.","He disappeared without saying nothing."],battle:["Alguien con quien quedabas dejó de responder sin explicar nada.","He dumped me.",'"Dump" es dejar a alguien, normalmente diciéndolo. "Ghost" es desaparecer sin una palabra.']},{en:"I'm not [looking for anything serious].",es:"No busco nada serio.",level:"B1",tags:["informal"],context:"Lo que se dice al principio de una cita o en un perfil.",meaning:"Aviso de que solo quiere algo casual. A veces es sincero; a veces, una salida de emergencia.",mistake:'Entender "no busco nada" y pensar que no quiere quedar contigo en absoluto.',ex:["Just so you know, I'm not looking for anything serious right now.","Para que lo sepas, ahora mismo no busco nada serio."],gist:"Solo quiero algo casual",literal:"No estoy mirando nada serio",wrong:["No quiero volver a verte","Busco pareja estable"],intent:"sincere",scene:"En la segunda cita, ella sonríe y lo suelta mientras pide otra copa.",cue:["So, honestly, what are you looking for?","I'm not searching anything serious.","I don't look for serious things."],chunkWrong:["searching anything serious","looking anything serious"],calques:["I don't search nothing serious.","I'm not searching anything serious."],battle:["Quieres dejar claro en una app que solo buscas algo casual.","I don't want a relationship with you.",`La segunda es personal y dura. "I'm not looking for anything serious" habla de ti, no de la otra persona.`]},{en:"Are you [always this charming], or is it just me?",es:"¿Siempre eres así de encantador o es solo conmigo?",level:"B2",tags:["flirty"],context:"Coqueteo con humor después de un detalle bonito.",meaning:"Halaga y provoca a la vez. La pregunta no busca respuesta: es una invitación a seguir el juego.",mistake:'Responder literalmente "Yes, always".',ex:["You remembered my coffee order? Are you always this charming?","¿Te acordabas de cómo tomo el café? ¿Siempre eres así de encantador?"],gist:"Estoy coqueteando contigo (con humor)",literal:"¿Eres siempre este encantamiento?",wrong:["Me estás molestando un poco","Te pregunto por tu carácter, sin más"],intent:"flirty",scene:"Tu cita te ha traído un libro que mencionaste de pasada hace dos semanas.",cue:["I saw this and thought of you.","Are you always so charmant?","You are always this enchanting?"],chunkWrong:["always this charmant","this always charming"],calques:["Are you always like this of charming, or only with me?","You are always so charmant or is only with me?"],battle:["Quieres coquetear con humor tras un detalle bonito.","You're very nice.",`"You're very nice" es amable pero plano (zona de amigos). La pregunta retórica coquetea.`]},{en:"I think we [want different things].",es:"Creo que buscamos cosas distintas.",level:"B2",tags:["polite"],context:"Fórmula estándar para cortar con elegancia.",meaning:"Eufemismo para romper sin culpar a nadie. Traducción real: se acabó.",mistake:"Pensar que es el inicio de una negociación sobre planes de futuro.",ex:["She wants kids, he wants a sailboat. They want different things.","Ella quiere hijos; él, un velero. Buscan cosas distintas."],gist:"Se acabó, dicho con educación",literal:"Creo que deseamos objetos diferentes",wrong:["Hagamos planes distintos este finde","Deberíamos ir juntos a terapia"],intent:"evasive",scene:"Después de cuatro meses, él te cita en un café un martes a las seis. Mal presagio.",cue:["Can we talk? I've been thinking about us.","I think we desire distinct things.","We want other stuffs."],chunkWrong:["want different stuffs","wish different things"],calques:["I believe we search different things.","I think we look for distinct things."],battle:["Quieres cortar con alguien sin culparle.","You're not my type anymore.",'La segunda hiere y suena superficial. "We want different things" es la fórmula neutral.']}]),Ub=ze({id:"meant",vol:4,title:"Things We Say, Things We Mean",tagline:"Subtitles for what people actually mean.",blurb:"Frases educadas que esconden otra cosa. Aprende a leer entre líneas.",unlock:2,colors:["#22262b","#5d6b78"]},[{en:"[With all due respect], that plan will fail.",es:"Con todo el respeto, ese plan va a fracasar.",level:"B2",tags:["polite","work"],context:"Antes de llevar la contraria, sobre todo a alguien con más poder.",meaning:'Casi siempre anuncia un desacuerdo fuerte. Traducción real: "estás equivocado".',mistake:"Esperar un cumplido después.",ex:["With all due respect, nobody asked for a fourth meeting.","Con todo el respeto, nadie ha pedido una cuarta reunión."],gist:"Voy a llevarte la contraria (con fuerza)",literal:"Con todo el respeto que se paga",wrong:["Te admiro muchísimo","Te pido disculpas"],intent:"passive-aggressive",scene:"En la reunión, el director propone recortar tu presupuesto a la mitad. Tu jefa levanta la mano.",cue:["I think we should cut the marketing budget by half.","With all respect due, no.","With all my respects, I disagree you."],chunkWrong:["With all the due respect","With all due respects"],calques:["With all the respect, that plan is going to fail.","With every respect, that plan goes to fail."],battle:["Quieres discrepar con firmeza de un superior en una reunión.","No offense, but...",'"No offense, but" es más informal y suena a que vas a ofender. "With all due respect" es el registro de reunión.']},{en:"Hmm, [I'll think about it].",es:"Mmm, me lo pensaré.",level:"B1",tags:["polite"],context:'Cuando no quieres comprometerte, o no quieres decir "no".',meaning:'Muchas veces es un "no" amable que evita el conflicto.',mistake:"Esperar que te llamen con una respuesta.",ex:[`"Join my pottery class?" "Hmm, I'll think about it."`,"—¿Te apuntas a mi clase de cerámica? —Mmm, me lo pensaré."],gist:"Probablemente no, pero no quiero decirlo",literal:"Pensaré sobre ello en serio",wrong:["Sí, cuenta conmigo","Necesito pensarlo una semana exacta"],intent:"evasive",scene:"Un vendedor te enseña un sofá carísimo y te pregunta si te lo llevas.",cue:["So, are you interested in the deal?","I will think it.","I'm going to think in it."],chunkWrong:["I'll think on it","I'll think it"],calques:["Hmm, I will think it.","Hmm, I'll think in it."],battle:['Quieres rechazar con suavidad una invitación sin decir "no".',"No, thanks.",`"No, thanks" es claro y directo. "I'll think about it" cierra la puerta sin conflicto.`]},{en:"[No worries] at all!",es:"¡No pasa nada!",level:"B1",tags:["informal"],context:'Respuesta a una disculpa o a un "gracias".',meaning:'Le quita importancia. Equivale a "tranquilo" o "de nada".',mistake:"Pensar que te dicen que no te preocupes por un problema serio.",ex:[`"Sorry I'm late!" "No worries at all, I just got here."`,"—¡Perdón por el retraso! —No pasa nada, acabo de llegar."],gist:"No pasa nada / de nada",literal:"Sin preocupaciones en absoluto",wrong:["No te preocupes, todo va a salir mal","No me importas"],intent:"sincere",scene:"Un desconocido te pisa en el metro y se disculpa enseguida.",cue:["Oh God, sorry, I stepped on your foot!","Nothing happens.","Don't worry you."],chunkWrong:["No worry","Not worries"],calques:["Nothing happens!","It doesn't pass nothing!"],battle:["Alguien te da las gracias por pasarle la sal.","Don't worry.",`"Don't worry" sugiere que había algo de qué preocuparse. Para un "gracias", "No worries" suena natural.`]},{en:"That's [an interesting choice].",es:"Es una elección... curiosa.",level:"C1",tags:["passive-aggressive"],context:"Cuando algo no te gusta pero no quieres decirlo.",meaning:'Suele significar "no me gusta nada", dicho con educación.',mistake:"Tomarlo como un elogio a tu originalidad.",ex:["Pineapple in a risotto? That's an interesting choice.","¿Piña en un risotto? Es una elección... curiosa."],gist:"No me gusta (dicho con educación)",literal:"Es una elección interesante y me encanta",wrong:["Me parece una idea brillante","No lo entiendo, explícamelo"],intent:"passive-aggressive",scene:"Tu suegra ve el tatuaje nuevo que te has hecho en el antebrazo.",cue:["I painted my entire living room neon green!","What an interesting election!","It is a curious election."],chunkWrong:["an interesting election","a interesting choice"],calques:["It's a curious election.","That's a curious election."],battle:["Tu amigo te enseña un abrigo horrible y no quieres herirle.","That's ugly.",`"That's ugly" es directo y duro. "That's an interesting choice" transmite lo mismo con elegancia.`]},{en:"I'm [fine]. Seriously, it's fine.",es:"Estoy bien. En serio, no pasa nada.",level:"B1",tags:["passive-aggressive"],context:"Cuando alguien está molesto pero no quiere hablarlo.",meaning:"Repetido y con tono seco, suele significar lo contrario: no está bien.",mistake:"Creértelo y cambiar de tema.",ex:["You forgot my birthday? No, it's fine. I'm fine.","¿Se te olvidó mi cumpleaños? No, tranquilo. Estoy bien."],gist:"No estoy bien, pero no voy a decirlo",literal:"Estoy multado",wrong:["Estoy perfectamente, gracias","Solo estoy cansado"],intent:"annoyed",scene:"Cancelaste la cena con tu pareja por tercera vez. Responde sin mirarte.",cue:["Are you mad at me?","I'm well. In serious, nothing passes.","I'm right. Seriously, it's right."],chunkWrong:["fined","alright good"],calques:["I'm well. In serious, nothing passes.","I'm good. Seriously, nothing happens."],battle:["Estás molesto pero no quieres discutir ahora.","I'm angry.",`"I'm angry" es honesto y directo. "I'm fine" seco es la forma típica (y poco sana) de decirlo sin decirlo.`]}]),Hb=ze({id:"office",vol:5,title:"Office Politics",tagline:"Corporate speak, decoded.",blurb:"Reuniones, correos y frases que suenan neutrales hasta que las entiendes.",unlock:2,colors:["#1f2723","#4f6b5d"]},[{en:"Let's [circle back] on that.",es:"Lo retomamos más adelante.",level:"B2",tags:["work","phrasal"],context:"En reuniones, para aparcar un tema.",meaning:"Posponer un tema. A veces, enterrarlo para siempre.",mistake:"Pensar que propone dar una vuelta.",ex:["Great question — let's circle back on that next week.","Buena pregunta, lo retomamos la semana que viene."],gist:"Lo dejamos para más adelante",literal:"Hagamos un círculo de vuelta",wrong:["Repitamos la presentación ya","Decidámoslo ahora mismo"],intent:"evasive",scene:"Preguntas en la reunión por la subida de sueldo prometida. Tu jefe mira el reloj.",cue:["Can we talk about the bonus structure?","Let's turn around on that."," n el hilo del presupuesto?"],gist:"Te incluyo / te mantengo informado",literal:"Te meteré en un bucle",wrong:["Te dejo fuera del proyecto","Te doy más trabajo"],intent:"sincere",scene:"Una compañera de otro equipo quiere saber cómo avanza el proyecto.",cue:["Can you keep me updated on the launch?","Sure, I will put you in copy.","Yes, I'll maintain you informed."],chunkWrong:["loop you on","lap you in"],calques:["I'll put you in copy when the client answers.","I'll maintain you informed when the client responds."],battle:["Quieres decir que incluirás a alguien en el hilo.","I'll inform you.",`"I'll inform you" suena formal y distante. "I'll loop you in" es lo habitual en la oficina.`]},{en:"That's [above my pay grade].",es:"Eso no me toca decidirlo a mí.",level:"C1",tags:["work","humorous","idiom"],context:"Cuando te preguntan por decisiones que no son tuyas.",meaning:"Dices con humor que no te corresponde: no te pagan lo suficiente para opinar.",mistake:"Pensar que hablas literalmente de tu salario.",ex:["Should we cancel the launch? Honestly, that's above my pay grade.","¿Cancelamos el lanzamiento? Sinceramente, eso no me toca a mí."],gist:"No me corresponde decidir eso (con humor)",literal:"Eso está por encima de mi nota de pago",wrong:["Quiero un aumento","Es demasiado caro para mí"],intent:"joking",scene:"Un becario te pregunta si la empresa se va a fusionar con la competencia.",cue:["Do you think they'll merge the two departments?","That is over my salary.","It is more than my pay level."],chunkWrong:["over my pay grade","above my paycheck"],calques:["That is over my salary.","That's above my pay level."],battle:["Te piden opinión sobre una decisión de dirección y quieres esquivarla con gracia.","I don't know.",`"I don't know" es plano. "Above my pay grade" esquiva con humor y marca que no es tu responsabilidad.`]},{en:"Let's [take this offline].",es:"Hablémoslo luego aparte.",level:"B2",tags:["work"],context:"En reuniones, cuando un tema se calienta o solo afecta a dos personas.",meaning:"Sacar el tema de la reunión para hablarlo en privado.",mistake:"Pensar que propone desconectarse de internet.",ex:["You two clearly disagree. Let's take this offline.","Está claro que no estáis de acuerdo. Hablémoslo luego aparte."],gist:"Lo hablamos aparte, fuera de la reunión",literal:"Desconectemos esto de internet",wrong:["Cancelemos la reunión para siempre","Apaguemos los ordenadores"],intent:"sincere",scene:"Dos directores empiezan a discutir delante de todo el equipo en una videollamada.",cue:["Honestly, your numbers make zero sense.","Let's disconnect this.","We speak it later in private."],chunkWrong:["take this out of line","put this offline"],calques:["Let's speak it later apart.","Let's talk this apart later."],battle:["Una discusión se alarga en una reunión de equipo.","Let's stop talking.",`"Let's stop talking" corta en seco. "Take this offline" propone seguir en otro momento, sin drama.`]}]),Yb=ze({id:"redflags",vol:11,title:"Red Flags",tagline:"Spot them before the third date.",blurb:"El vocabulario para describir comportamientos que mejor detectar pronto.",unlock:5,colors:["#331414","#9c2f2f"]},[{en:"He's rude to waiters? [That's a red flag].",reply:"On the first date? [That's a red flag].",es:"¿Es borde con los camareros? Mala señal.",level:"B1",tags:["informal"],context:"Señales de que alguien o algo va a dar problemas.",meaning:"Una advertencia: ese comportamiento anticipa problemas.",mistake:"Pensar en banderas o en política.",ex:["No friends from before the age of thirty? Red flag.","¿Ningún amigo de antes de los treinta? Mala señal."],gist:"Mala señal, cuidado",literal:"Eso es una bandera roja de un país",wrong:["Es una buena noticia","Es su equipo de fútbol"],intent:"sincere",scene:"Tu amiga cuenta que su cita le revisó el móvil en la primera cena.",cue:["He asked for my phone password on the first date.","That's a red alarm.","That's an alarm signal."],chunkWrong:["That's a red alarm","That's a red sign"],calqu k burner.","Tiene sus planes profesionales aparcados."],gist:"Eres su plan B",literal:"Te mantiene en el fogón de atrás",wrong:["Te cocina la cena","Te tiene muy presente"],intent:"sincere",scene:"Ella solo te escribe cuando sus otros planes se cancelan.",cue:["She only texts me when her plans fall through.","She has you in the reserve.","She keeps you like second plate."],chunkWrong:["keeping you on the back oven","keeping you in the back burner"],calques:["She answers every three days. She has you as second plate.","She replies each three days. She keeps you in reserve."],battle:["Describes a alguien que te mantiene como opción secundaria.","She forgets you.",'"Forgets you" es olvidar. "Back burner" es tenerte aparcado, por si acaso.']},{en:"He picks your outfits? [It's giving] control freak.",es:"¿Te elige la ropa? Me da vibras de controlador.",level:"C1",tags:["slang","humorous"],context:"Slang reciente para describir la impresión que da algo.",meaning:`"It's giving..." = transmite, da la sensación de.`,mistake:"Pensar que está dando algo físicamente.",ex:["Candles, jazz and a typewriter? It's giving writer in Paris.","¿Velas, jazz y máquina de escribir? Rollo escritor en París."],gist:"Da la sensación de ser un controlador",literal:"Está dando un controlador",wrong:["Te regala un mando","Es muy generoso"],intent:"joking",scene:"Tu amiga cuenta que su novio le dice qué ponerse cada mañana.",cue:["He picks my outfits every morning. Cute, right?","It's giving me a controller.","It gives vibrations of controller."],chunkWrong:["It's gave","It gives it"],calques:["He chooses your clothes? It gives me vibes of controller.","He chooses your clothes? It gives vibrations of controller."],battle:["Comentas en tono coloquial y moderno la impresión que da alguien.","He seems controlling.",`Neutral y correcto. "It's giving..." es slang reciente, más gracioso, entre amigos.`]},{en:"It's never his fault. He [never takes accountability].",reply:"Because he [never takes accountability].",es:"Nunca es culpa suya. Nunca asume su responsabilidad.",level:"C1",tags:["informal"],context:"Alguien que siempre culpa a otros.",meaning:"Nunca reconoce sus errores; siempre hay una excusa.",mistake:'Confundirlo con contabilidad ("accounting").',ex:['Taking accountability means saying "I messed up" without a "but".','Asumir la responsabilidad es decir "la he liado" sin un "pero".'],gist:"Nunca reconoce sus errores",literal:"Nunca lleva la contabilidad",wrong:["Nunca paga la cuenta","Nunca se enfada"],intent:"sincere",scene:'Tu compañero de piso rompe la tostadora y dice que "ya estaba rara".',cue:["Why is it always someone else's fault with him?","He never assumes his responsibility.","He doesn't take responsibility of nothing."],chunkWrong:["never takes accounting","never makes accountability"],calques:["It's never his fault. He never assumes his responsibility.","Never is his fault. He never assumes nothing."],battle:["Describes a alguien que siempre culpa a los demás.","He never says sorry.",'"Never says sorry" es no disculparse. "Never takes accountability" es más profundo: no asumir nada.']}]),Gb=ze({id:"twoam",vol:12,title:"Overthinking at 2 AM",tagline:"For when your brain will not log off.",blurb:"El inglés de la ansiedad nocturna, los mensajes en visto y los bucles mentales.",unlock:6,colors:["#141a2a","#3c4f7a"]},[{en:"I'm [overthinking] this, aren't I?",es:"Le estoy dando demasiadas vueltas, ¿verdad?",level:"B1",tags:["informal"],context:"Cuando analizas algo hasta agobiarte.",meaning:"Analizar en exceso, en bucle, aunque no haga falta.",mistake:`Decir "I'm thinking too much in this".`,ex:["Stop overthinking it. It was just an emoji.","Deja de darle vueltas. Era solo un emoji."],gist:"Le estoy dando demasiadas vueltas",literal:"Estoy pensando por encima de esto",wrong:["Estoy muy concentrado","No lo he pensado nada"],intent:"sincere",scene:'Llevas veinte minutos redactando un "ok" de respuesta.',cue:["Why are you still staring at that text?" taurant.","Alex doesn't like the food but is being polite and funny about it.","Alex wants to meet the chef.","Alex thinks the food is too spicy."],answer:1,explain:"«Brave» aplicado a comida, ropa o decisiones es un eufemismo irónico: algo arriesgado que no ha salido bien. Alex evita decir «está malo» sin ofender a Sam.",ex:["Pineapple on a burger? That's a brave choice.","¿Piña en una hamburguesa? Qué valiente (o sea: qué horror)."]}),H({id:"tw-dat-2",col:"dating",level:"B2",setting:"Mia and Leo have been texting for two weeks. Tonight he finally calls.",lines:[["Leo","So I was thinking... maybe dinner on Friday?"],["Mia","Oh, I'd love to, but Friday's tricky."],["Leo","Saturday?"]],twist:["Mia","Saturday's... also a day."],key:"Saturday's also a day.",tone:"evasive",options:["Mia is confirming that Saturday works.","Mia is avoiding the date without actually saying no.","Mia is confused about the calendar.","Mia wants to go out on both days."],answer:1,explain:"Responder con una obviedad («el sábado también es un día») es una evasiva torpe y cómica. No dice que no, pero tampoco que sí: muestra poco interés.",ex:["'Are you free next week?' 'Next week is... a week.'","—¿Estás libre la semana que viene? —La semana que viene es... una semana."]}),H({id:"tw-dat-3",col:"dating",level:"B2",setting:"A first date. Chris has been talking about his ex for forty minutes.",lines:[["Chris","...and that's why she was totally wrong about the dog."],["Chris","Anyway, enough about me. Tell me about you!"]],twist:["Dana","Oh, I wouldn't want to interrupt. You and your ex seem very close."],key:"You and your ex seem very close.",tone:"passive_aggressive",options:["Dana thinks Chris should get back together with his ex.","Dana is pointing out, with irony, that Chris won't stop talking about his ex.","Dana wants to meet the ex.","Dana is jealous of the dog."],answer:1,explain:"Ironía con un punto pasivo-agresivo: «parecéis muy unidos» significa en realidad «llevas toda la cita hablando ke the weekend.",tone:"amused",options:["The task is quick and easy.","The manager is joking, but the task really is big.","The manager is inviting you on a weekend trip.","The task is due next month."],answer:1,explain:"Ironía de oficina: llama «cosa pequeña» a algo que te ocupará el fin de semana entero. Medio broma, pero el trabajo es real.",ex:["Quick question. It'll only take your entire afternoon.","Una pregunta rápida. Solo te llevará la tarde entera."]}),H({id:"tw-of-2",col:"office",level:"C1",setting:"In a meeting, Greg presents your idea as his own.",lines:[["Greg","...so that's my proposal."],["Boss","Brilliant, Greg."]],twist:["You","It is brilliant. I remember thinking exactly the same thing last Tuesday."],key:"I remember thinking exactly the same thing last Tuesday.",tone:"passive_aggressive",options:["You agree with Greg and support him.","You are subtly claiming that the idea was yours.","You forgot what happened on Tuesday.","You want to schedule a meeting for Tuesday."],answer:1,explain:"Comentario pasivo-agresivo de manual corporativo: no acusas a Greg, pero dejas claro delante del jefe que la idea era tuya.",ex:["Great point. It was also a great point when I made it in my email.","Buen apunte. También lo fue cuando lo dije en mi correo."]}),H({id:"tw-of-3",col:"office",level:"B1",setting:"A colleague finally replies to your urgent email. Two weeks later.",lines:[["Colleague","So sorry for the late reply!"]],twist:["You","No problem at all. The project only finished last week."],key:"The project only finished last week.",tone:"sarcastic",options:["You are relieved the project is over.","You are pointing out, sarcastically, that the reply is useless now.","You are asking for more time.","You are thanking them for their help."],answer:1,explain:"Sarcasmo suave: «no pasa nada» seguido de un dato que demuestra que sí pasa. La respuesta llega cuando ya no sirve de nada.",ex:["Thanks for the reminder about the deadline. It was yesterday.","Gracias por recordarme la fecha límite. Fue ayer."]}),H({id:"tw-of-4",col:"office",level:"B2",setting:"It's the team's fourth meeting this week about having fewer meetings.",lines:[["Ana","So, how do we cut down on meetings?"],["Tim","Maybe we should set up a meeting to discuss it."]],twist:["Ana","Great idea. Let's make it a weekly one."],key:"Let's make it a weekly one.",tone:"dry",options:["Ana loves meetings.","Ana is mocking how absurd the situation is.","Ana wants to reduce the workload.","Ana is changing the subject."],answer:1,explain:"Ironía ante lo absurdo: proponer una reunión semanal sobre reducir reuniones lleva la idea al extremo para señalar lo ridícula que es.",ex:["We need fewer emails. I'll send an email about it.","Necesitamos menos correos. Mandaré un correo al respecto."]}),H({id:"tw-of-5",col:"office",level:"C1",setting:"Your annual review. Your manager is reading from your file.",lines:[["Manager","You're very... creative with deadlines."],["You","Thank you!"]],twist:["Manager","That wasn't exactly a compliment."],key:"You're very creative with deadlines.",tone:"dry",question:"What did the manager mean by 'creative with deadlines'?",options:["You often miss deadlines.","You come up with original ideas.","You set very ambitious deadlines.","You work best under pressure."],answer:0,explain:"«Creativo con los plazos» es un eufemismo: no cumples las fechas. La gracia está en que tú te lo tomas como un elogio y el jefe tiene que aclararlo.",ex:["He's quite flexible with the truth.","Es bastante flexible con la verdad (o sea: miente)."]}),H({id:"tw-aw-1",col:"awkward",level:"B1",setting:"Someone waves at you in the street, so you wave back enthusiastically.",lines:[["You","Hi!!"],["Stranger","...Sorry, I was waving at the person behind you."]],twist:["You","Yeah, no, I knew that. I was just... stretching."],key:"I was just stretching.",tone:"nervous",options:["You really were stretching.","You are making an obvious excuse to hide your embarrassment.","You want  no."]],twist:["Jamie (private)","On the bright side, the CEO finally knows my name."],key:"On the bright side, the CEO finally knows my name.",tone:"dry",options:["Jamie is genuinely happy about the mistake.",'Jamie is finding a funny "positive side" to a disaster.',"Jamie wanted to send it to the CEO.","Jamie is asking for a promotion."],answer:1,explain:"«On the bright side» (por el lado bueno) usado con ironía: busca un consuelo absurdo en pleno desastre. Humor autocrítico.",ex:["I failed my driving test, but on the bright side, the examiner was lovely.","Suspendí el carné, pero por el lado bueno, el examinador era majísimo."]}),H({id:"tw-aw-5",col:"awkward",level:"B2",setting:"You gave a wedding speech. Nobody laughed at any of your jokes.",lines:[["Guest","That was... a speech."],["You","Thank you?"]],twist:["Guest","Bold of you to try comedy."],key:"Bold of you to try comedy.",tone:"dry",options:["The guest admires your courage.","The guest thinks your jokes weren't funny.","The guest wants you to perform again.","The guest didn't hear the speech."],answer:1,explain:"«Bold of you» (qué atrevido por tu parte) suele esconder una crítica: lo has intentado, pero no ha funcionado.",ex:["Wearing white to a wedding? Bold.","¿Ir de blanco a una boda? Atrevido."]}),H({id:"tw-sa-1",col:"sarcasm",level:"B1",setting:"It's pouring with rain, and your friend forgot the umbrella.",lines:[["Friend","So... I forgot the umbrella."]],twist:["You","Great. I always wanted to swim to work."],key:"Great. I always wanted to swim to work.",tone:"sarcastic",options:["You love swimming.","You are annoyed and use sarcasm about getting soaked.","You want to change jobs.","You think the rain will stop soon."],answer:1,explain:"Sarcasmo clásico: dices que deseabas algo que claramente no deseas. El «Great» del principio ya avisa del tono.",ex:["Perfect. A flat tyre. Exactly what this day needed.","Perfecto. Un pinchazo. Justo lo que le faltaba al día."]}),H({id:"tw-sa-2",col:"sarcasm",level:"B2",setting:"Your brother finishes assembling a wardrobe. Three screws are left over.",lines:[["Brother","Done! And I didn't even need the instructions."]],twist:["You","Clearly. The screws are just a bonus."],key:"The screws are just a bonus.",tone:"sarcastic",options:["You think the extra screws are a gift.","You are mocking him: he put it together wrong.","You want to keep the screws.","You are impressed by his skills."],answer:1,explain:"«Clearly» (ya se ve) + «los tornillos son un extra» = burla: si sobran tornillos, algo está mal montado.",ex:["You don't need a map? Clearly. That's why we're in the wrong city.","¿No necesitas mapa? Ya se ve. Por eso estamos en otra ciudad."]}),H({id:"tw-sa-3",col:"sarcasm",level:"C1",setting:"Your colleague announces his fifth 'life-changing' business idea this year.",lines:[["Colleague","This time it's different. Subscriptions... for houseplants."]],twist:["You","Wow. I can't believe nobody's thought of that yet."],key:"I can't believe nobody's thought of that yet.",tone:"dry",options:["You think it's a genius idea.","You are implying that the idea is ridiculous.","You want to invest.","You are surprised it already exists."],answer:1,explain:"Sarcasmo seco: aparentas asombro, pero el sentido real es «nadie lo ha hecho porque es absurdo».",ex:["A café that only serves cereal for fifteen euros? Revolutionary.","¿Una cafetería que solo sirve cereales a quince euros? Revolucionario."]}),H({id:"tw-sa-4",col:"sarcasm",level:"B2",setting:"You spent all morning cleaning. Your partner walks in and drops muddy shoes on the floor.",lines:[["Partner","Hey! Is there anything to eat?"]],twist:["You","Oh, don't worry about the floor. I mopped it just so you could decorate it."],key:"I mopped it just so you could decorate it.",tone:"frustrated",options:["You want them to decorate the house.","You are sarcastically angry about the mud.","You love their shoes.","You are offering them food."],answer:1,explain:"Sarcasmo con enfado: presentas e rprises.","You are being sarcastic about the repeated mistakes.","You want to try everything on the menu.","You aren't hungry."],answer:1,explain:"Ironía educada: en vez de quejarte, finges que los errores son un «menú sorpresa». Se queja sin levantar la voz.",ex:["Another delay? I love these unplanned adventures.","¿Otro retraso? Me encantan estas aventuras improvisadas."]}),H({id:"tw-ev-3",col:"everyday",level:"B2",setting:"Your neighbour has been drilling the wall at 7 a.m. every day this week.",lines:[["Neighbour","Morning! Sorry if the drilling is loud."]],twist:["You","Not at all. Who needs an alarm clock?"],key:"Who needs an alarm clock?",tone:"sarcastic",options:["The noise wakes you up every morning, and you're not happy about it.","You want to buy an alarm clock.","You love waking up early.","You are offering to help with the drilling."],answer:0,explain:"Pregunta retórica sarcástica: el ruido te despierta cada día. Suena amable, pero es una queja.",ex:["Your dog barks all night. Who needs sleep anyway?","Tu perro ladra toda la noche. Total, ¿quién necesita dormir?"]}),H({id:"tw-ev-4",col:"everyday",level:"C1",setting:"Your mum called three times during your work presentation. You call her back afterwards.",lines:[["Mum","Why didn't you answer?"],["You","I was in a meeting!"]],twist:["Mum","Ah. So you're too important for your mother now."],key:"So you're too important for your mother now.",tone:"passive_aggressive",options:["Mum is proud of your job.","Mum is making you feel a bit guilty, half joking.","Mum wants to work with you.","Mum doesn't know what a meeting is."],answer:1,explain:"Chantaje emocional en broma (un «guilt trip»): no está enfadada de verdad, pero quiere que te sientas un poquito culpable.",ex:["Oh, you're busy? I'll just sit here on my own, then.","¿Estás ocupado? Pues nada, me quedo aquí solita."]}),H({id:"tw-ev-5",col:"everyday",level:"B2",setting:"Your friend asked you to help him move house 'for an hour'. It's now 9 p.m.",lines:[[" arcastic)",es:"Lo teme (sarcasmo)",explain:"Seco y sin energía: no quiere que llegue el momento (una reunión, el dentista...)."},{id:"nervous",tone:"nervous",intent:"Excited but anxious",es:"Ilusionado pero nervioso",explain:"Risa nerviosa y voz algo temblorosa: le hace ilusión y miedo a la vez."}]},{id:"va-talk",text:"We need to talk.",level:"B2",context:"Alguien cercano te para un momento.",decoy:"Joking",deliveries:[{id:"good",tone:"warm",intent:"Friendly: good news is coming",es:"Amable: viene una buena noticia",explain:"Cálido y con una sonrisa: la frase temida pierde su peso; algo bueno viene."},{id:"serious",tone:"serious",intent:"Serious: something is wrong",es:"Grave: algo va mal",explain:"Lento, grave y sin sonrisa: el clásico aviso de malas noticias."},{id:"nervous",tone:"nervous",intent:"Anxious about a confession",es:"Nervioso por confesar algo",explain:"Dudas y voz insegura: es quien habla el que está preocupado por lo que va a contar."}]},{id:"va-join",text:"Nice of you to join us.",level:"B2",context:"Alguien llega a una reunión que ya ha empezado.",decoy:"Indifference",deliveries:[{id:"welcome",tone:"warm",intent:"Sincere welcome",es:"Bienvenida sincera",explain:"Cálido y abierto: se alegra de que hayas venido."},{id:"callout",tone:"sarcastic",intent:"Calling out the lateness",es:"Echa en cara el retraso",explain:"Tono plano y cortante: «qué detalle que vengas... tarde». Delante de todos."},{id:"teasing",tone:"amused",intent:"Teasing a friend",es:"Pique amistoso",explain:"Con risa: le pica por llegar tarde, pero sin enfado real."}]},{id:"va-really",text:"Really?",level:"B1",context:"Te acaban de contar algo inesperado.",decoy:"Gratitude",deliveries:[{id:"surprised",tone:"surprised",intent:"Genuine, happy surprise",es:"Sorpresa alegre",explain:"Subida fuerte y alegre: no se lo esperaba y le encanta."},{id:"doubt",tone:"suspicious",intent:`Disbelief: "I don't buy it"`,es:"Incredulidad: no se lo cree",explain:"Bajo y alargado, con duda: cuestiona lo qu
